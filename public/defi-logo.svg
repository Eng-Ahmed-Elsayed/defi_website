<svg viewBox="0 0 520 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="defiPyramidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="defiTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="defiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Bus Terminal Node -->
  <circle cx="42" cy="74" r="16" stroke="url(#defiPyramidGrad)" stroke-width="4.5" fill="#07101E" filter="url(#defiGlow)"/>
  <circle cx="42" cy="74" r="6" fill="#00F0FF" />
  
  <!-- Lower Circuit Trace -->
  <path d="M 58 74 L 175 74 L 235 18 L 275 88 L 305 18 L 375 74 L 465 74" stroke="url(#defiPyramidGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#defiGlow)"/>

  <!-- Parallel Inner Circuit Traces -->
  <path d="M 68 62 L 155 62 L 210 18" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M 390 62 L 455 62" stroke="#A855F7" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- Inner Chip Interconnects -->
  <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 245 42 L 345 42 L 360 26" />
    <circle cx="245" cy="42" r="3.5" fill="#00F0FF" />
    <circle cx="360" cy="26" r="3.5" fill="#C084FC" />

    <path d="M 235 56 L 335 56 L 348 44" />
    <circle cx="235" cy="56" r="3.5" fill="#00F0FF" />
    <circle cx="348" cy="44" r="3.5" fill="#C084FC" />

    <path d="M 245 70 L 320 70 L 335 60" />
    <circle cx="245" cy="70" r="3.5" fill="#00F0FF" />
    <circle cx="335" cy="60" r="3.5" fill="#C084FC" />
  </g>

  <!-- Right Bus Terminal Node -->
  <circle cx="480" cy="74" r="16" stroke="url(#defiPyramidGrad)" stroke-width="4.5" fill="#07101E" filter="url(#defiGlow)"/>
  <circle cx="480" cy="74" r="6" fill="#A855F7" />

  <!-- Brand Typography -->
  <text x="260" y="132" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="23.5" font-weight="800" letter-spacing="1.8" text-anchor="middle" fill="url(#defiTextGrad)">
    DIGITAL EGYPT FOR INVESTMENT
  </text>
  <text x="260" y="152" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#94A3B8" opacity="0.9">
    مصر الرقمية للاستثمار · DEFI
  </text>
</svg>
