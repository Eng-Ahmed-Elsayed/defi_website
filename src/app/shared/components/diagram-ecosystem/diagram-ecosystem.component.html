<div class="diagram-wrapper card-glass" role="region" [attr.aria-label]="lang.t().diagramATitle">
  <div class="diagram-header">
    <div class="diagram-status">
      <span class="status-indicator"></span>
      <span class="diagram-title-text">{{ lang.t().diagramATitle }}</span>
    </div>
    <div class="diagram-header-right">
      <div class="diagram-telemetry-strip" aria-label="Architecture Scope">
        <span class="tele-pill live"><span class="tele-dot"></span> <span>{{ throughputDisplay() }}</span></span>
        <span class="tele-pill"><span class="tele-icon" aria-hidden="true">⚖️</span> <span>{{ latencyDisplay() }}</span></span>
        <span class="tele-pill"><span class="tele-icon" aria-hidden="true">🛡️</span> <span>{{ lang.t().telemetrySecurity }}</span></span>
      </div>
      <span class="diagram-tag">{{ lang.t().diagramAInteractiveTag }}</span>
    </div>
  </div>

  <div class="diagram-canvas-container">
    <svg class="ecosystem-svg" [class.traffic-burst]="isSimulating()" viewBox="0 0 680 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
      <defs>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E5FD8" />
          <stop offset="100%" stop-color="#38BDF8" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6366F1" />
          <stop offset="100%" stop-color="#A855F7" />
        </linearGradient>
        <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#087E8B" />
          <stop offset="100%" stop-color="#14B8A6" />
        </linearGradient>
      </defs>

      <!-- Background Connection Traces with Pulse Animations -->
      <g class="network-traces" opacity="0.6">
        <path id="trace-citizens-core" d="M 170 85 L 170 150 L 340 180" stroke="url(#blueGrad)" stroke-width="2" stroke-dasharray="4 4" class="animated-trace"/>
        <path id="trace-ministries-core" d="M 510 85 L 510 150 L 340 180" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="4 4" class="animated-trace"/>
        <path id="trace-core-registries" d="M 340 250 L 170 290 L 170 345" stroke="url(#blueGrad)" stroke-width="2" stroke-dasharray="4 4" class="animated-trace"/>
        <path id="trace-core-infra" d="M 340 250 L 510 290 L 510 345" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="4 4" class="animated-trace"/>
        <path id="trace-core-center" d="M 340 250 L 340 345" stroke="url(#tealGrad)" stroke-width="2.5" class="solid-trace"/>
      </g>

      <!-- Animated Data Packets Traveling Along Paths -->
      <circle r="4.5" fill="#38BDF8" class="data-packet" filter="drop-shadow(0 0 6px #38BDF8)">
        <animateMotion dur="2.4s" repeatCount="indefinite" path="M 170 85 L 170 150 L 340 180" />
      </circle>
      <circle r="4.5" fill="#C084FC" class="data-packet" filter="drop-shadow(0 0 6px #C084FC)">
        <animateMotion dur="2.8s" repeatCount="indefinite" path="M 510 85 L 510 150 L 340 180" />
      </circle>
      <circle r="4.5" fill="#38BDF8" class="data-packet" filter="drop-shadow(0 0 6px #38BDF8)">
        <animateMotion dur="2.6s" repeatCount="indefinite" path="M 340 250 L 170 290 L 170 345" />
      </circle>
      <circle r="4.5" fill="#2DD4BF" class="data-packet" filter="drop-shadow(0 0 6px #2DD4BF)">
        <animateMotion dur="2.2s" repeatCount="indefinite" path="M 340 250 L 510 290 L 510 345" />
      </circle>

      <!-- Layer 1 (Top Left): Citizens & Business Channels -->
      <g class="diagram-node node-interactive" [class.active]="activeNode() === 'citizens'" (click)="selectNode('citizens', true)" (mouseenter)="selectNode('citizens', true)" tabindex="0" role="button" aria-label="Citizens and Businesses Layer">
        <rect x="35" y="30" width="270" height="74" rx="14" class="node-box" />
        @if (lang.isArabic()) {
          <circle cx="268" cy="67" r="18" fill="#1E5FD8" fill-opacity="0.2" stroke="#1E5FD8" stroke-width="1.5"/>
          <path d="M262 74 C262 70 265 67 268 67 C271 67 274 70 274 74 M268 64 A3.5 3.5 0 1 0 268 57 A3.5 3.5 0 1 0 268 64" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round"/>
          <text x="238" y="60" direction="rtl" unicode-bidi="embed" text-anchor="start" class="svg-node-title">{{ lang.t().ecosystemNodes[0].title }}</text>
          <text x="238" y="78" direction="rtl" unicode-bidi="embed" text-anchor="start" class="svg-node-sub">{{ lang.t().ecosystemNodes[0].subtitle }}</text>
        } @else {
          <circle cx="70" cy="67" r="18" fill="#1E5FD8" fill-opacity="0.2" stroke="#1E5FD8" stroke-width="1.5"/>
          <path d="M64 74 C64 70 67 67 70 67 C73 67 76 70 76 74 M70 64 A3.5 3.5 0 1 0 70 57 A3.5 3.5 0 1 0 70 64" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round"/>
          <text x="102" y="60" text-anchor="start" class="svg-node-title">Citizen & Business Channels</text>
          <text x="102" y="78" text-anchor="start" class="svg-node-sub">Portals · Mobile Apps · Service Centers</text>
        }
      </g>

      <!-- Layer 1 (Top Right): Ministries & Public Entities -->
      <g class="diagram-node node-interactive" [class.active]="activeNode() === 'ministries'" (click)="selectNode('ministries', true)" (mouseenter)="selectNode('ministries', true)" tabindex="0" role="button" aria-label="Government Entities Layer">
        <rect x="375" y="30" width="270" height="74" rx="14" class="node-box" />
        @if (lang.isArabic()) {
          <circle cx="608" cy="67" r="18" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.5"/>
          <path d="M600 73 L616 73 M602 73 L602 64 L608 59 L614 64 L614 73 M608 64 L608 73" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round"/>
          <text x="578" y="60" direction="rtl" unicode-bidi="embed" text-anchor="start" class="svg-node-title">{{ lang.t().ecosystemNodes[1].title }}</text>
          <text x="578" y="78" direction="rtl" unicode-bidi="embed" text-anchor="start" class="svg-node-sub">{{ lang.t().ecosystemNodes[1].subtitle }}</text>
        } @else {
          <circle cx="410" cy="67" r="18" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.5"/>
          <path d="M402 73 L418 73 M404 73 L404 64 L410 59 L416 64 L416 73 M410 64 L410 73" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round"/>
          <text x="442" y="60" text-anchor="start" class="svg-node-title">Government Entities & Ministries</text>
          <text x="442" y="78" text-anchor="start" class="svg-node-sub">MOE · IDSC · 25+ Public Bodies</text>
        }
      </g>

      <!-- Layer 2 (Center Core): DEFI Digital Enablement Backbone -->
      <g class="diagram-core-node" [class.active]="activeNode() === 'defi-core' || activeNode() === 'core'" (click)="selectNode('defi-core', true)" (mouseenter)="selectNode('defi-core', true)" tabindex="0" role="button" aria-label="DEFI Digital Enablement Backbone">
        <rect x="150" y="160" width="380" height="100" rx="16" class="core-box" />
        @if (lang.isArabic()) {
          <circle cx="485" cy="210" r="24" fill="#087E8B" fill-opacity="0.3" stroke="#00D2D3" stroke-width="2"/>
          <path d="M474 218 L485 200 L496 218 Z M485 206 L496 206 L500 202" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="445" y="196" direction="rtl" unicode-bidi="embed" text-anchor="start" class="svg-core-title">{{ lang.t().ecosystemNodes[2].title }}</text>
          <text x="445" y="217" direction="rtl" unicode-bidi="embed" text-anchor="start" class="svg-core-sub">{{ lang.t().ecosystemNodes[2].role }}</text>
          <text x="445" y="234" direction="rtl" unicode-bidi="embed" text-anchor="start" class="svg-core-sub-secondary">{{ lang.t().ecosystemNodes[2].subtitle }}</text>
        } @else {
          <circle cx="195" cy="210" r="24" fill="#087E8B" fill-opacity="0.3" stroke="#00D2D3" stroke-width="2"/>
          <path d="M184 218 L195 200 L206 218 Z M195 206 L206 206 L210 202" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="235" y="196" text-anchor="start" class="svg-core-title">DEFI Digital Enablement Backbone</text>
          <text x="235" y="217" text-anchor="start" class="svg-core-sub">Enterprise Architecture · Interoperability</text>
          <text x="235" y="234" text-anchor="start" class="svg-core-sub-secondary">National Data Bus · Secure Integration APIs</text>
        }
      </g>

      <!-- Layer 3 (Bottom Left): National Registries & Data Assets -->
      <g class="diagram-node node-interactive" [class.active]="activeNode() === 'registries'" (click)="selectNode('registries', true)" (mouseenter)="selectNode('registries', true)" tabindex="0" role="button" aria-label="National Registries Layer">
        <rect x="35" y="340" width="270" height="74" rx="14" class="node-box" />
        @if (lang.isArabic()) {
          <circle cx="268" cy="377" r="18" fill="#1E5FD8" fill-opacity="0.2" stroke="#1E5FD8" stroke-width="1.5"/>
          <path d="M260 372 C260 369 276 369 276 372 C276 375 260 375 260 372 M260 377 C260 380 276 380 276 377 M260 382 C260 385 276 385 276 382" stroke="#60A5FA" stroke-width="1.8"/>
          <text x="238" y="370" direction="rtl" unicode-bidi="embed" text-anchor="start" class="svg-node-title">{{ lang.t().ecosystemNodes[3].title }}</text>
          <text x="238" y="388" direction="rtl" unicode-bidi="embed" text-anchor="start" class="svg-node-sub">{{ lang.t().ecosystemNodes[3].subtitle }}</text>
        } @else {
          <circle cx="70" cy="377" r="18" fill="#1E5FD8" fill-opacity="0.2" stroke="#1E5FD8" stroke-width="1.5"/>
          <path d="M62 372 C62 369 78 369 78 372 C78 375 62 375 62 372 M62 377 C62 380 78 380 78 377 M62 382 C62 385 78 385 78 382" stroke="#60A5FA" stroke-width="1.8"/>
          <text x="102" y="370" text-anchor="start" class="svg-node-title">National Registries & Data</text>
          <text x="102" y="388" text-anchor="start" class="svg-node-sub">Interoperable Base Registers</text>
        }
      </g>

      <!-- Layer 3 (Bottom Right): Secure Cloud & Infrastructure -->
      <g class="diagram-node node-interactive" [class.active]="activeNode() === 'infra'" (click)="selectNode('infra', true)" (mouseenter)="selectNode('infra', true)" tabindex="0" role="button" aria-label="Cloud and Infrastructure Layer">
        <rect x="375" y="340" width="270" height="74" rx="14" class="node-box" />
        @if (lang.isArabic()) {
          <circle cx="608" cy="377" r="18" fill="#087E8B" fill-opacity="0.2" stroke="#087E8B" stroke-width="1.5"/>
          <path d="M600 380 C598 380 596 378 596 375 C596 372 599 370 602 370 C603 367 606 365 610 365 C614 365 617 368 618 371 C621 371 623 374 623 377 C623 380 621 382 618 382 L600 382" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round"/>
          <text x="578" y="370" direction="rtl" unicode-bidi="embed" text-anchor="start" class="svg-node-title">{{ lang.t().ecosystemNodes[4].title }}</text>
          <text x="578" y="388" direction="rtl" unicode-bidi="embed" text-anchor="start" class="svg-node-sub">{{ lang.t().ecosystemNodes[4].subtitle }}</text>
        } @else {
          <circle cx="410" cy="377" r="18" fill="#087E8B" fill-opacity="0.2" stroke="#087E8B" stroke-width="1.5"/>
          <path d="M402 380 C400 380 398 378 398 375 C398 372 401 370 404 370 C405 367 408 365 412 365 C416 365 419 368 420 371 C423 371 425 374 425 377 C425 380 423 382 420 382 L402 382" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round"/>
          <text x="442" y="370" text-anchor="start" class="svg-node-title">Secure Cloud & Infrastructure</text>
          <text x="442" y="388" text-anchor="start" class="svg-node-sub">High-Availability Gov Centers · 24/7 Ops</text>
        }
      </g>
    </svg>
  </div>

  <!-- Dynamic Node Info Box -->
  <div class="diagram-info-panel" id="diagram-a-tooltip">
    <div class="info-content-wrap">
      <span class="info-icon" aria-hidden="true">ℹ️</span>
      <p class="info-text" id="diagram-a-info-text">{{ getInfoText() }}</p>
    </div>
    <button type="button" class="btn btn-sm btn-simulate" (click)="simulateTraffic()" [disabled]="isSimulating()" title="Trigger an animated digital traffic burst across Egypt's architecture">
      <span class="pulse-indicator"></span>
      <span>{{ isSimulating() ? (lang.isArabic() ? 'جاري تدفق البيانات...' : 'Traffic Pulsing...') : lang.t().btnSimulateTraffic }}</span>
    </button>
  </div>
</div>
