<main id="main-content" class="not-found-page">
  <div class="container not-found-container">
    <div class="not-found-card glass-panel">
      <span class="error-badge">{{ lang.isArabic() ? '٤٠٤ · المسار غير موجود' : '404 · ROUTE NOT FOUND' }}</span>
      <h1 class="error-code">{{ lang.isArabic() ? '٤٠٤' : '404' }}</h1>
      <h2 class="not-found-title">{{ lang.t().notFoundTitle }}</h2>
      <p class="not-found-desc">{{ lang.t().notFoundDesc }}</p>

      <div class="not-found-actions">
        <a routerLink="/" class="btn btn-primary">
          <span>{{ lang.t().notFoundReturnHome }}</span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </a>
        <a routerLink="/capabilities" class="btn btn-secondary">
          <span>{{ lang.t().heroCtaSecondary }}</span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </a>
        <a routerLink="/contact" class="btn btn-outline">
          <span>{{ lang.t().navContactCTA }}</span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </div>
  </div>
</main>
